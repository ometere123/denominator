name: Standalone Contract Baseline
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install unit-test tooling
        run: python -m pip install pytest==8.3.5 pycryptodome==3.24.1
      - name: Install repository-local CLI from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify repository-local CLI pin
        shell: pwsh
        run: |
          if ($IsWindows) {
            $version = & .\node_modules\.bin\genlayer.cmd --version
          } else {
            $version = & ./node_modules/.bin/genlayer --version
          }
          if ($version -notmatch '(^|\D)0\.39\.1($|\D)') { throw "Unexpected local GenLayer CLI version: $version" }
          $version
      - name: Static preflight
        run: python scripts/preflight.py
      - name: Read-only stable RPC guard
        run: python -c "from scripts.network_guard import rpc_chain_id; assert rpc_chain_id() == '0xf22f'"
      - name: Dependency-free unit/adversarial simulator
        run: python -m pytest -q tests/unit
      - name: Focused mutation checks
        run: python scripts/mutation_check.py
      - name: Python syntax validation
        run: python -m compileall -q contracts tests scripts

  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Direct Mode tooling
        run: python -m pip install -r requirements-test.txt
      - name: Native Direct Mode contract tests
        run: python -m pytest -q tests/direct

  genvm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned linter
        run: python -m pip install -r requirements-lint.txt
      - name: GenVM AST lint
        run: |
          genvm-lint lint contracts/denominator.py --json
          genvm-lint lint examples/rate_gate.py --json
      - name: Stable v0.2.12 semantic ABI validation
        env:
          GENVM_VERSION: v0.2.12
        run: |
          genvm-lint validate contracts/denominator.py --json
          genvm-lint validate examples/rate_gate.py --json
